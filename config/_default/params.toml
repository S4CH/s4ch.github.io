# Appearance
env = 'production' 	# Enable OpenGraph protocol
#images = "/link"

defaultTheme = 'auto'
DisableThemeToggle = false

ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = false
ShowBreadCrumbs = false
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = true
tocopen = false

# Home page mode
displayFullLangName = true
mainSections = ["research"]
ShowAllPagesInArchive = true

# Custom CSS
[assets]
disableHLJS = false

[homeInfoParams]
Title = "[~]$ whoami?"
Content = """
Security engineer and researcher. eBPF security, EDR internals, and threat intelligence. Breaking things at the kernel level and hunting threat actors across phishing infrastructure.
"""

