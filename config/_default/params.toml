# SEO information
author = "Sachin Kumar"
description = "Sachin Kumar's personal security research site. Threat hunting, reverse engineering, eBPF security, EDR internals, and vulnerability research."
keywords = [
	"Cybersecurity",
	"Blog",
	"Portfolio"
]

